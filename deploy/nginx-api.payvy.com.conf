# /etc/nginx/sites-available/payvy on thatch-api-prod. TLS here; kamal-proxy
# on 127.0.0.1:8090 routes by host to the payvy container.
limit_req_zone $binary_remote_addr zone=payvy_webhook:10m rate=60r/m;
limit_req_zone $binary_remote_addr zone=payvy_signin:10m rate=10r/m;

server {
    listen 80;
    server_name api.payvy.com app.payvy.com;
    location /.well-known/acme-challenge/ {
        root /var/www/payvy-acme;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    # One certificate covers both names (certbot -d api.payvy.com -d app.payvy.com).
    server_name api.payvy.com app.payvy.com;
    ssl_certificate /etc/letsencrypt/live/api.payvy.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.payvy.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    add_header Strict-Transport-Security "max-age=86400" always;
    add_header X-Robots-Tag "noindex, nofollow" always;

    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_http_version 1.1;
    proxy_connect_timeout 5s;
    proxy_read_timeout 120s;

    # A 25 MB document is about 34 MB as base64 JSON; the server limits it too.
    client_max_body_size 36m;

    location /webhooks/email {
        client_max_body_size 26m;
        limit_req zone=payvy_webhook burst=30 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8090;
    }
    # Asking for sign-in links; the server also limits links per person.
    location = /auth/link {
        limit_req zone=payvy_signin burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8090;
    }
    location / {
        proxy_pass http://127.0.0.1:8090;
    }
}
